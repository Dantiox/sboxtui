[package]
name = "sboxtui"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Energy-efficient TUI network controller for sing-box (system stack), Clash subscriptions, and WireGuard uplinks"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
toml = "0.8"
